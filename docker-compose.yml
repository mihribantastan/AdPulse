services:
  app:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --no-progress &&
             php artisan migrate --force &&
             (cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php)"

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adpulse
      POSTGRES_USER: mihriban
      POSTGRES_PASSWORD: mihri.T.3425
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mihriban -d adpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    restart: unless-stopped
    build:
      context: ./ai_layer
      dockerfile: Dockerfile
    volumes:
      - ./ai_layer:/app
    env_file:
      - ./ai_layer/.env
    environment:
      REDIS_HOST: redis
      LARAVEL_URL: http://app:8000/api/campaigns/complete
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pgdata:
  redisdata:
