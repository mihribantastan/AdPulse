services:
  app:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      # Kullanıcı yüklemeleri (campaign-assets) backend/ bind mount'unun İÇİNDEKİ bu
      # tek dizinin üzerine ayrıca mount ediliyor - Laravel'in "public" disk kökü.
      - ./adpulse/assets:/var/www/html/storage/app/public
    ports:
      - "8000:8000"
    env_file:
      - ./adpulse/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --no-progress &&
             php artisan migrate --force &&
             php artisan storage:link --force &&
             rm -f storage/logs/octane-server-state.json &&
             php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000"

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file:
      - ./adpulse/.env
    ports:
      - "5432:5432"
    # NOT: ./adpulse/db'yi doğrudan bir Windows host yoluna (C:\...) bind-mount etmeyi
    # denedik ama Postgres veri dizinini Docker Desktop'ın Windows<->Linux dosya
    # paylaşım katmanından tanıyamadı, sessizce initdb çalıştırıp BOŞ bir veritabanı
    # oluşturdu. Bu proje bu yüzden WSL2'nin NATIVE Linux dosya sisteminde
    # (örn. ~/AdPulse, /mnt/c/... DEĞİL) tutulmalı - "docker compose" komutları bir
    # WSL shell'inden çalıştırılmalı. Native Linux fs'te bind-mount sorunsuz çalışıyor.
    volumes:
      - ./adpulse/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mihriban -d adpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    restart: unless-stopped
    build:
      context: ./ai_layer
      dockerfile: Dockerfile
    volumes:
      - ./ai_layer:/app
    env_file:
      - ./adpulse/.env
    environment:
      LARAVEL_URL: http://app:8000/api/campaigns/complete
      LARAVEL_PUBLISH_URL: http://app:8000/api/campaigns/publish-complete
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # Postgres'ten günlük yedek alır (./adpulse/backups altına), 14 günden eski
  # dosyaları temizler. Servis her zaman ayakta kalıp 24 saatte bir çalışıyor -
  # "docker compose up" açıkken otomatik işler, kapalıyken almaz (basit yerel
  # kurulum için yeterli; sürekli açık bir sunucuda gerçek cron'a taşınabilir).
  backup:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file:
      - ./adpulse/.env
    volumes:
      - ./adpulse/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S)
          echo "[backup] $$STAMP yedek alınıyor..."
          if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c -f "/backups/adpulse_$$STAMP.dump"; then
            echo "[backup] tamamlandı: adpulse_$$STAMP.dump"
          else
            echo "[backup] BAŞARISIZ oldu"
          fi
          find /backups -name 'adpulse_*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  redisdata:
