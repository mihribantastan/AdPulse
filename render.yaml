services:
  - type: web
    name: adpulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: AdPulse
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: OCTANE_SERVER
        value: swoole
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: REDIS_CLIENT
        value: predis
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      # Aşağıdakiler gizli/ortama özel değerler - Render deploy sırasında
      # panelde elle doldurulmalı (Blueprint bunları boş bırakıp soracak):
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
